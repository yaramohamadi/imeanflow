dataset:
    # Default dataset; launch scripts override this from DATASET_NAME.
    root: /projets/Ymohammadi/datasets/caltech-101_processed_latents
    num_classes: 101
    num_classes_from_data: True

model:
    # Native iMF -> iMF finetuning with DogFit guidance from a frozen source copy
    # of the loaded pretrained checkpoint.
    model_str: imfDiT_XL_2
    num_classes: 101
    training_mode: imf_jvp
    cfg_beta: 1.0
    class_dropout_prob: 0.0
    use_dogfit: True
    target_use_null_class: False
    source_prediction_space: 'v'
    source_num_classes: 1000
    use_auxiliary_v_head: True
    use_ema_vc: True
    guidance_scale_strategy: fixed
    fixed_guidance_scale: 1.5
    baked_guidance_blend: 0.5
    training_guidance_interval_strategy: fixed
    training_guidance_t_min: 0.0
    training_guidance_t_max: 1.0
    training_guidance_start_step: 0

training:
    log_per_step: 250
    checkpoint_per_epoch: 1000000

    num_epochs: 200
    max_train_steps: 40000
    batch_size: 8
    use_ema: True
    learning_rate: 0.0001
    warmup_epochs: 5

    adam_b2: 0.95
    ema_type: const
    ema_val: 0.9998

    sample_per_step: 1000
    preview_at_step_zero: False
    fid_per_step: 2500
    metric_num_steps:
        - 4
    preview_guidance_scales:
        - 1.5
    preview_num_steps:
        - 1
        - 2
        - 4
    debug_log_during_train: True
    debug_log_images: True
    debug_num_images: 4
    debug_velocity_decode_scale: 0.1
    grad_accum_steps: 4
    save_best_fid_only: True
    best_fid_checkpoint_dir: best_fid
    fid_use_online_only: True
    capture_source_from_load: True

    seed: 42

fid:
    device_batch_size: 8
    sample_device_batch_size: 8
    sample_num_local_devices: 1
    num_samples: 10000
    cache_ref: '/projets/Ymohammadi/imeanflow/files/fid_stats/caltech-101-fid_stats.npz'
    num_images_to_log: 100

fd_dino:
    arch: vitb14
    model_name: ''
    cache_ref: '/projets/Ymohammadi/imeanflow/files/fdd_stats/caltech-101-fd_dino-vitb14_stats.npz'

sampling:
    num_steps: 4
    method: euler
    half_precision: False
    half_precision_dtype: float16
    omega: 1.5
    t_min: 0.0
    t_max: 1.0

logging:
    use_wandb: True
    wandb_name: ''
    wandb_project: 'plain_imf_dogfit_finetune'
    wandb_entity: 'yara-mohammadi-bahram-1-ecole-superieure-de-technologie'
    wandb_tags:
        - finetune
        - plain-imf
        - dogfit
        - meanflow
    wandb_notes: 'Native iMF DogFit meanflow fine-tuning from iMF checkpoint'

load_from: '/projets/Ymohammadi/imeanflow/files/weights/iMF-XL-2-full'
partial_load: True

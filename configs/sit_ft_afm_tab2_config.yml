# Tab. 2 row "FT + AFM" for SiT-XL/2 (main_afm_sit_ft.py / train_afm_sit_ft.py).
# Generator = target-finetuned PLAIN SiT (flaxSiT_XL_2, velocity, Linear path; FT = plain_sit_finetune_1gpu).
# Objective = official fixed-NFE AFM (Adversarial-Flow-Models train_afm_multi_nfe.yaml: use_t_tgt False,
# pred v, steps K), K = afm.num_steps = sampling.num_steps = 4 Euler jumps on the sampler's own grid.
# AFM hyperparameters = sit_meft_afm_tab2 (the SiT "MF-T + AFM" row): lr 1e-5 G/D, 1:1, no D warmup,
# Adam (0, 0.95), wd 0.01, lambda_cp 0.01, lambda_gp 0 and lambda_ot 0 (as in that row), 60000 batches.
# NO guidance in training (class dropout 0.1 keeps the null class); CFG only at sampling, omega 1.5
# (= FT's sampling.omega) -> the "4x2" row. Final eval also reports omega 1.0 (no CFG, 4 NFE).
# Per-dataset root / num_classes / fid / fd_dino are overridden by scripts/run_sit_ft_afm.sh.
dataset:
    root: /opt/dlami/nvme/meanflow/datasets/caltech-101_processed_latents
    image_size: 32
    image_channels: 4
    vae: mse
    name: caltech101_latent
    class_mapping_root: ''
    num_classes: 101
    num_classes_from_data: True
    num_workers: 4
    prefetch_factor: 2
    pin_memory: True

model:
    model_str: flaxSiT_XL_2
    num_classes: 101
    target_use_null_class: True
    class_dropout_prob: 0.1
    use_auxiliary_v_head: False
    uses_classifier_free_guidance: True   # sampler gets sampling.omega (CFG) at eval

transport:
    path_type: Linear
    prediction: velocity
    loss_weight: null
    train_eps: null
    sample_eps: null
    objective: sit
    path_power_k: 1.0

afm:
    ablation: afm_only
    num_steps: 4
    lambda_adv: 1.0
    lambda_imf: 0.0
    lambda_ot: 0.0
    lambda_ot_end: 0.0
    lambda_ot_decay_steps: 0
    lambda_anchor: 0.0
    anchor_decay_steps: 30000
    lambda_gp: 0.0
    lambda_cp: 0.01
    fd_epsilon: 0.01
    gp_batch_fraction: 0.25
    interval_eps: 0.001
    min_interval: 0.05
    p_r_zero: 0.25
    discriminator_warmup_steps: 0
    d_steps_per_g_step: 1
    discriminator_updates: True
    generator_learning_rate: 0.00001
    discriminator_learning_rate: 0.00001
    generator_lr_warmup_steps: 100
    discriminator_lr_warmup_steps: 100
    generator_weight_decay: 0.01
    discriminator_weight_decay: 0.01
    adam_beta1: 0.0
    adam_beta2: 0.95
    discriminator_init: generator
    discriminator_trainable_blocks: -1
    freeze_discriminator_backbone: False
    discriminator_width_multiplier: 1.0
    discriminator_depth: 0
    use_discriminator_augmentation: False
    discriminator_augmentation_probability: 0.0
    load_generator_ema: False   # FT checkpoints were trained with use_ema=False
    max_posttrain_batches: 60000
    max_abs_discriminator_logit: 100.0
    resume_from: ''

training:
    num_epochs: 1000
    batch_size: 2
    grad_accum_steps: 1
    adam_b2: 0.999
    use_ema: True
    ema_val: 0.99
    log_per_step: 100
    checkpoint_per_epoch: 1
    sample_per_step: 5000
    preview_num_steps: [4]
    preview_num_images: 16
    fid_per_step: 0
    fid_schedule:
        - from_step: 5000
          every_steps: 5000
    metric_num_steps: [4]
    save_best_fid_only: False
    save_best_fid_eval_state_only: True
    best_fid_checkpoint_dir: best_fid
    seed: 42

fid:
    cache_ref: /opt/dlami/nvme/meanflow/imeanflow_adversarial/files/fid_stats/caltech-101-fid_stats.npz
    device_batch_size: 1
    sample_device_batch_size: 1
    sample_log_every: 25
    num_samples: 10000

fd_dino:
    arch: vitb14
    cache_ref: /opt/dlami/nvme/meanflow/imeanflow_adversarial/files/fdd_stats/caltech-101-fd_dino-vitb14_stats.npz

sampling:
    num_classes: 101
    num_steps: 4
    method: euler
    half_precision: False
    omega: 1.5
    t_min: 0.0
    t_max: 1.0

logging:
    use_wandb: False
    wandb_project: afm_sit_ft
    wandb_name: sit_ft_afm
    wandb_entity: ''
    wandb_tags: [sit-ft, afm, posttrain]

load_from: ''
partial_load: True

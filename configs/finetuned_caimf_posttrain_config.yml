dataset:
    root: /scratch/zahradt/datasets/caltech-101_processed_latents
    num_classes: 101
    num_classes_from_data: True
    num_workers: 4
    prefetch_factor: 2
    pin_memory: True

model:
    model_str: imfDiT_XL_2
    num_classes: 101
    training_mode: imf_jvp
    target_use_null_class: True
    use_auxiliary_v_head: True
    use_dogfit: False
    class_dropout_prob: 0.1
    cfg_beta: 1.0
    guidance_scale_strategy: sampled
    max_sampled_guidance_scale: 8.0

caimf:
    lambda_imf: 0.01
    lambda_adv: 1.0
    lambda_ot: 0.0
    lambda_cp: 0.001
    interval_eps: 0.001
    gen_learning_rate: 0.00001
    dis_learning_rate: 0.00001
    adam_beta1: 0.0
    adam_beta2: 0.95
    weight_decay: 0.0
    discriminator_warmup_batches: 5000
    discriminator_steps_per_cycle: 4
    discriminator_updates: True
    freeze_discriminator_backbone: False
    load_generator_ema: False
    max_posttrain_batches: 155000

training:
    num_epochs: 1000
    batch_size: 2
    grad_accum_steps: 1
    use_ema: True
    ema_val: 0.9999
    log_per_step: 100
    checkpoint_per_epoch: 1
    sample_per_step: 5000
    preview_num_steps:
        - 1
        - 2
        - 4
    preview_num_images: 16
    fid_per_step: 0
    fid_schedule:
        - from_step: 5000
          every_steps: 2500
    metric_num_steps:
        - 4
    save_best_fid_only: False
    save_best_fid_eval_state_only: True
    best_fid_checkpoint_dir: best_fid
    save_eval_checkpoint_per_fid: False
    eval_checkpoint_dir: latest_eval
    seed: 42

fid:
    cache_ref: /home/zahradt/links/projects/def-hadi87/zahradt/imeanflow/files/fid_stats/caltech-101-fid_stats.npz
    device_batch_size: 2
    sample_device_batch_size: 2
    sample_log_every: 25
    num_samples: 10000

fd_dino:
    arch: vitb14
    cache_ref: /home/zahradt/links/projects/def-hadi87/zahradt/imeanflow/files/fdd_stats/caltech-101-fd_dino-vitb14_stats.npz

sampling:
    num_classes: 101
    num_steps: 4
    omega: 7.5
    t_min: 0.4
    t_max: 0.65

logging:
    use_wandb: False
    wandb_project: caimf_finetuned_imf
    wandb_name: finetuned_caimf_posttrain
    wandb_entity: yara-mohammadi-bahram-1-ecole-superieure-de-technologie
    wandb_tags:
        - caimf
        - target-finetuned-source
        - posttrain
    wandb_notes: CA-iMF post-training initialized from target-dataset fine-tuned iMF checkpoints.

load_from: ''
partial_load: True
